planning:
  planner: joint_space_linear
  time_step_s: 0.1

  velocity_limits:
    base_joint_rad_s: 3.14
    shoulder_joint_rad_s: 0.042
    elbow_joint_rad_s: 0.0355
    limits_verified: true

  collision_checking:
    enabled: true
    safety_margin_m: 0.02

  execution:
    enabled: false
    require_calibration: true
    require_verified_joint_limits: true

units:
time: seconds
angle: radians
length: meters
